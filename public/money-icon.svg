<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed background so the icon also works as a maskable Android icon;
       artwork stays inside the middle 80% safe zone. -->
  <rect width="512" height="512" fill="#1e3a8a"/>
  <g transform="translate(96 128)">
    <!-- wallet / card body -->
    <rect x="0" y="24" width="320" height="208" rx="28" fill="#ffffff"/>
    <rect x="0" y="72" width="320" height="36" fill="#2563eb"/>
    <!-- rupee mark -->
    <text x="160" y="196" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="96"
          font-weight="700" fill="#172033" text-anchor="middle">₹</text>
    <!-- in / out arrows -->
    <path d="M40 12 L40 -44 M18 -22 L40 -44 L62 -22" fill="none" stroke="#16a34a"
          stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M280 -44 L280 12 M258 -10 L280 12 L302 -10" fill="none" stroke="#f87171"
          stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
