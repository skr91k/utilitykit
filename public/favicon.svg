<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- utilitykit: crossed hammer and wrench on the brand purple gradient -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a2be2"/>
      <stop offset="1" stop-color="#4b0f8c"/>
    </linearGradient>
    <mask id="jaw">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="40" y="6" width="8" height="18" rx="1" transform="rotate(45 44 20)" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- hammer: handle runs bottom-right to top-left, head across it -->
  <path d="M47 47L25 25" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <rect x="9" y="17.5" width="26" height="10" rx="2.5" transform="rotate(-45 22 22.5)" fill="#fff"/>
  <!-- wrench: handle runs bottom-left to top-right, open jaw at the top -->
  <g mask="url(#jaw)">
    <path d="M17 47L40 24" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="44" cy="20" r="9.5" fill="#fff"/>
  </g>
</svg>
